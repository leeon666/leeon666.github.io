<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LEEON 的高性能 3D 个人主页：操控角色探索作品、能力、简介与联系方式。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23101718'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23d88a4c'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%235eb7bf'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f7efe2'/%3E%3C/svg%3E"
    />
    <title>LEEON | 3D Personal Homepage</title>
    <script type="module" crossorigin src="/assets/index-CS04JG8R.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/three-1f3OZu7T.js">
    <link rel="stylesheet" crossorigin href="/assets/index-aFXEb-zT.css">
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="3D personal homepage scene"></canvas>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="scene-noise" aria-hidden="true"></div>
      <button class="look-lock" type="button" aria-label="启用第一人称视角">
        <span>点击进入第一人称</span>
        <strong>WASD 移动 · Shift 加速 · 空格跳跃 · V 切视角 · 左键击打 · E 进入</strong>
      </button>
      <div class="crosshair" aria-hidden="true">
        <span></span>
      </div>
      <div class="weapon-hud" aria-live="polite">
        <span>ENERGY</span>
        <strong class="ammo-value">24/24</strong>
        <span>HITS</span>
        <strong class="target-value">0</strong>
        <small class="mode-value">FIRST</small>
      </div>
      <div class="action-toast" aria-live="polite"></div>

      <header class="topbar" aria-label="Profile overview">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i></span>
          <div class="brand-copy">
            <p class="eyebrow">LEEON / Interactive Portfolio</p>
            <h1>LEEON</h1>
            <p class="tagline">3D 个人主页 · 作品集空间</p>
          </div>
          <div class="brand-stat" aria-live="polite">
            <span>RENDER</span>
            <strong class="perf-value">AUTO</strong>
          </div>
        </div>

        <nav class="quick-nav" aria-label="Quick links">
          <button class="nav-button" type="button" data-page="about">
            <span class="nav-glyph nav-glyph-about" aria-hidden="true"></span>
            <span>简介</span>
          </button>
          <button class="nav-button" type="button" data-page="work">
            <span class="nav-glyph nav-glyph-work" aria-hidden="true"></span>
            <span>作品</span>
          </button>
          <button class="nav-button" type="button" data-page="skills">
            <span class="nav-glyph nav-glyph-skills" aria-hidden="true"></span>
            <span>技能</span>
          </button>
          <button class="nav-button" type="button" data-page="contact">
            <span class="nav-glyph nav-glyph-contact" aria-hidden="true"></span>
            <span>联系</span>
          </button>
        </nav>
      </header>

      <aside class="status-panel" aria-live="polite">
        <div class="status-head">
          <div>
            <p class="zone-label">Current Zone</p>
            <strong class="zone-title">中心广场</strong>
          </div>
          <span class="distance-pill">Roam</span>
        </div>

        <div class="mini-map" aria-label="Portfolio map">
          <span class="map-axis map-axis-x" aria-hidden="true"></span>
          <span class="map-axis map-axis-y" aria-hidden="true"></span>
          <button
            class="map-node map-about"
            type="button"
            data-page="about"
            data-map="about"
            aria-label="Open about page"
          ></button>
          <button
            class="map-node map-work"
            type="button"
            data-page="work"
            data-map="work"
            aria-label="Open work page"
          ></button>
          <button
            class="map-node map-skills"
            type="button"
            data-page="skills"
            data-map="skills"
            aria-label="Open skills page"
          ></button>
          <button
            class="map-node map-contact"
            type="button"
            data-page="contact"
            data-map="contact"
            aria-label="Open contact page"
          ></button>
          <span class="map-player" aria-hidden="true"></span>
        </div>

        <button class="enter-button" type="button" disabled>
          <span class="enter-dot" aria-hidden="true"></span>
          <span class="enter-label">WASD 前往入口</span>
        </button>
      </aside>

      <section class="page-panel" aria-live="polite" aria-hidden="true">
        <span class="panel-beam" aria-hidden="true"></span>
        <button class="close-panel" type="button" aria-label="Close page">&times;</button>
        <p class="panel-kicker">Personal Page</p>
        <h2></h2>
        <div class="panel-rule" aria-hidden="true"></div>
        <div class="panel-body"></div>
      </section>

      <div class="joystick" aria-hidden="true">
        <span></span>
      </div>

      <div class="loading" aria-hidden="true">
        <div class="loading-lockup">
          <span class="loading-mark"></span>
          <div class="loading-bar"><span></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
